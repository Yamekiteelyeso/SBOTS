# SBot 2.4.0 - jugadores simulados en PlayerList de Paper.
# No se crean conexiones TCP reales ni se autentican cuentas Microsoft.
max-bots: 40
max-create-per-command: 20
# Mostrar los bots en el contador y en el hover de la lista multijugador del backend.
server-list-enabled: true
server-list-show-names: true
server-list-max-sample: 12
# Los bots consumen puestos del contador: reserva huecos para personas reales.
minimum-free-slots: 2
restore-on-startup: true
load-premium-skins: true
skin-cache: true
spawn-spacing-blocks: 2.0
# Alcance dentro del cual los clientes reciben las entidades SBot.
visibility-range-blocks: 96
# Reenvia spawn discretamente para recuperar entidades perdidas por plugins de tracking.
visibility-resync-ticks: 200
# Solo mientras el proceso Paper esta encendido.
keep-bot-chunks-loaded: true
# Evita expulsiones por timeout / inactividad del cliente simulado.
prevent-automatic-kicks: true
# Un watchdog comprueba los jugadores cada 2 segundos y restaura entradas perdidas.
auto-reconnect-missing-bots: true
# Los usernames son generados, no copiados de cuentas premium conocidas.
# Ejemplos: Zelrox_4382, Kirozen_2377, Nexovia_8172
name-prefix: ""
# Las skins públicas son independientes de los nombres visibles.
# Estos nombres SOLO sirven para consultar las texturas en Mojang.
# Puedes usar tus propias cuentas premium como fuente de texturas.
skin-source-pool:
  - Xisuma
  - jeb_
  - Iskall85
  - Grian
  - Notch
  - EthosLab
  - MumboJumbo
  - Dinnerbone
