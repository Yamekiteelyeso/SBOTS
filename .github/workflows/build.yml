name: Build SBot (Paper 1.20.1)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile and package JAR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build reobfuscated Paper plugin
        run: gradle --no-daemon clean reobfJar --stacktrace

      - name: Prepare plugin JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          test -s build/libs/SBot-2.4.0.jar
          cp build/libs/SBot-2.4.0.jar dist/SBot-2.4.0-Paper-1.20.1.jar
          echo "Generated plugin artifact:"
          ls -lh dist/

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: SBot-Paper-1.20.1
          path: dist/SBot-2.4.0-Paper-1.20.1.jar
          if-no-files-found: error
          retention-days: 30

  smoke:
    name: Test SBot on a real Paper server
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download compiled plugin
        uses: actions/download-artifact@v4
        with:
          name: SBot-Paper-1.20.1
          path: server/plugins/

      - name: Download official Paper 1.20.1 and prepare world
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p server/plugins/SBot
          AGENT="SBot-Integration-Test/2.4.0 (https://github.com/Yamekiteelyeso/SBOTS)"
          PAPER_BUILD="$(curl -fsSL --retry 3 -H "User-Agent: ${AGENT}" \
            https://fill.papermc.io/v3/projects/paper/versions/1.20.1/builds/196)"
          PAPER_URL="$(printf '%s' "$PAPER_BUILD" | jq -r '.downloads["server:default"].url // empty')"
          PAPER_SHA="$(printf '%s' "$PAPER_BUILD" | jq -r '.downloads["server:default"].checksums.sha256 // empty')"
          test -n "$PAPER_URL"
          curl -fsSL --retry 3 --connect-timeout 25 -H "User-Agent: ${AGENT}" "$PAPER_URL" -o server/paper.jar
          if [ -n "$PAPER_SHA" ]; then printf '%s  %s\n' "$PAPER_SHA" "server/paper.jar" | sha256sum --check; fi
          printf 'eula=true\n' > server/eula.txt
          cat > server/server.properties <<'PROPS'
          server-port=25566
          online-mode=false
          max-players=20
          allow-flight=true
          view-distance=5
          simulation-distance=4
          level-type=minecraft:flat
          level-name=world
          enable-rcon=true
          rcon.port=25575
          rcon.password=sbot-smoke-test
          spawn-protection=0
          enforce-secure-profile=false
          motd=SBot integration test
          PROPS
          cat > server/plugins/SBot/bots.yml <<'BOTS'
          bots:
            SBotTester:
              world: world
              x: 0.5
              y: 75.0
              z: 0.5
              yaw: 0.0
              pitch: 0.0
          BOTS

      - name: Set up Minecraft test client runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Minecraft 1.20.1 test client
        run: npm install --no-save --no-audit --no-fund mineflayer@4

      - name: Verify visibility, player-command teleport and persistence
        run: python3 scripts/smoke_test.py
